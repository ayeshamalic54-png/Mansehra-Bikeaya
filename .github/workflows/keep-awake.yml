name: Keep SafarGo Render Server Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 45 "https://mansehra-bikeaya.onrender.com/api/health"
          echo ""
