name: Build Android APK & Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-apk/**'
      - 'desktop-exe/**'
      - '.github/workflows/build-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore mobile-apk/app/release-keystore.jks \
            -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
            -alias bikeaya -storepass mansehra123 -keypass mansehra123 \
            -dname "CN=Mansehra Bikeaya, OU=Mobile, O=MansehraBikeaya, L=Mansehra, ST=KPK, C=PK"

      - name: Build Signed Android Release APK
        working-directory: mobile-apk
        run: gradle assembleRelease --no-daemon

      - name: Rename APK Artifact
        run: cp mobile-apk/app/build/outputs/apk/release/app-release.apk MansehraBikeaya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MansehraBikeaya.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller & PyWebView
        run: pip install -r desktop-exe/requirements-desktop.txt

      - name: Generate Icon & Build Windows EXE
        working-directory: desktop-exe
        run: |
          python generate_icon.py
          pyinstaller --noconfirm --onefile --windowed --icon=icon.ico --name=MansehraBikeayaDesk app.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop-exe/dist/MansehraBikeayaDesk.exe

  publish-release:
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - name: Publish Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Mansehra Bikeaya v1.0.0 (Android APK & Windows EXE)
          body: |
            Official installable binaries connected to https://mansehra-bikeaya.onrender.com:
            - **MansehraBikeaya.apk** — Android Mobile App (Customers, Motorbike Captains & Admin)
            - **MansehraBikeayaDesk.exe** — Windows Desktop App (Admin Dispatch, Rider Settlements & P&L)
          files: |
            MansehraBikeaya.apk
            MansehraBikeayaDesk.exe
