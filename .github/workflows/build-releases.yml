name: Build SafarGo Android APK & Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-apk/**'
      - 'desktop-exe/**'
      - '.github/workflows/build-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses & Configure SDK 35
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_DIR" > mobile-apk/local.properties
          SDKMGR=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "Found sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          "$SDKMGR" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore or Generate Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile-apk/app/release-keystore.jks
          else
            keytool -genkeypair -v -keystore mobile-apk/app/release-keystore.jks \
              -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
              -alias bikeaya -storepass mansehra123 -keypass mansehra123 \
              -dname "CN=SafarGo, OU=Mobile, O=SafarGo, L=Mansehra, ST=KPK, C=PK"
          fi

      - name: Build Signed Android Release APK
        working-directory: mobile-apk
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../apk-build.log

      - name: Publish APK Failure Log (only on error)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-log
          name: Debug APK Build Log
          prerelease: true
          files: apk-build.log

      - name: Rename APK Artifact
        run: cp mobile-apk/app/build/outputs/apk/release/app-release.apk SafarGo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: SafarGo.apk

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller & PyWebView
        run: pip install -r desktop-exe/requirements-desktop.txt

      - name: Generate Icon & Build Windows EXE
        working-directory: desktop-exe
        run: |
          python generate_icon.py
          pyinstaller --noconfirm --onefile --windowed --icon=icon.ico --name=SafarGoDesk app.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop-exe/dist/SafarGoDesk.exe

  publish-release:
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true

      - name: Publish Release v1.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: SafarGo v1.2.0 (Android APK & Windows EXE)
          body: |
            Official SafarGo installable apps connected to https://safargoride.onrender.com:
            - **SafarGo.apk (v1.2.0)** — Native Android GPS Bridge, Mobile Map Fix, Target SDK 35 & Verified v2/v3 APK Signature
            - **SafarGoDesk.exe (v1.2.0)** — Windows Desktop App (Admin Dispatch, Rider Settlements & P&L)
          files: |
            SafarGo.apk
            SafarGoDesk.exe
