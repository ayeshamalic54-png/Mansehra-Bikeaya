plugins {
    id 'com.android.application'
}

android {
    namespace 'pk.mansehra.bikeaya'
    compileSdk 35

    defaultConfig {
        applicationId "pk.mansehra.bikeaya"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            def ksFile = file("release-keystore.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("ANDROID_KS_PASS") ?: "mansehra123"
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "bikeaya"
                keyPassword System.getenv("ANDROID_KEY_PASS") ?: "mansehra123"
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file("release-keystore.jks").exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
}
