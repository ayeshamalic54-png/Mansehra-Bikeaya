<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#009E4D" />
    <meta name="application-name" content="SafarGo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SafarGo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SafarGo — Bikes, AC Cars &amp; Express Parcels</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.json?v=2" />
    <script>
      window.__safargoDeferredPrompt = null;
      window.__safargoPwaInstalled = false;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__safargoDeferredPrompt = e;
        window.dispatchEvent(new Event('safargo-install-available'));
      });
      window.addEventListener('appinstalled', function () {
        window.__safargoDeferredPrompt = null;
        window.__safargoPwaInstalled = true;
        window.dispatchEvent(new Event('safargo-app-installed'));
      });
    </script>
  </head>
  <body class="text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
